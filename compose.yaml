services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipfactory}
      POSTGRES_USER: ${POSTGRES_USER:-clipfactory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipfactory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    environment:
      # Hardware-safety defaults sized for the documented ~10.7 GiB WSL host.
      # These caps primarily protect machine responsiveness; routing, batching,
      # caching, and the local-work ceilings provide the wall-time gains.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "${OLLAMA_MAX_QUEUE:-4}"
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-4096}"
    cpus: "${OLLAMA_CPUS:-9}"
    mem_limit: "${OLLAMA_MEM_LIMIT:-6g}"
    memswap_limit: "${OLLAMA_MEMSWAP_LIMIT:-8g}"
    pids_limit: 512
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      CLIPFACTORY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clipfactory}:${POSTGRES_PASSWORD:-clipfactory}@postgres:5432/${POSTGRES_DB:-clipfactory}
      CLIPFACTORY_REDIS_URL: redis://redis:6379/0
      CLIPFACTORY_STORAGE_ROOT: /var/lib/clipfactory
      CLIPFACTORY_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./backend:/app
      - ./storage:/var/lib/clipfactory
      - whisper_model_cache:/root/.cache/huggingface
    ports: ["${BACKEND_PORT:-8300}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    env_file:
      - path: .env
        required: false
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--pool=solo", "--loglevel=INFO", "--concurrency=1", "--max-tasks-per-child=1", "--queues=media,transcription"]
    environment:
      PYTHONPATH: /app
      CLIPFACTORY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clipfactory}:${POSTGRES_PASSWORD:-clipfactory}@postgres:5432/${POSTGRES_DB:-clipfactory}
      CLIPFACTORY_REDIS_URL: redis://redis:6379/0
      CLIPFACTORY_STORAGE_ROOT: /var/lib/clipfactory
      CLIPFACTORY_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./backend:/app
      - ./storage:/var/lib/clipfactory
      - whisper_model_cache:/root/.cache/huggingface
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8300}
    ports: ["${FRONTEND_PORT:-3301}:3000"]
    depends_on: [backend]

volumes:
  postgres_data:
  redis_data:
  whisper_model_cache:
  ollama_models:
