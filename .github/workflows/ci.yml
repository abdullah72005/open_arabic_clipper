name: Continuous integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install FFmpeg for media pipeline tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend and test tools
        run: python -m pip install --upgrade pip && python -m pip install . coverage pytest pytest-asyncio httpx ruff
      - name: Run backend tests with coverage
        run: coverage run --source=app -m pytest && coverage report --show-missing --fail-under=79 && coverage xml -o coverage.xml
      - name: Check backend formatting and lint
        run: ruff format --check app tests && ruff check app tests
      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  frontend:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
